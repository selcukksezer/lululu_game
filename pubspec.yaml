name: lululu_game
description: "LÜLÜLÜ — viral TikTok sesleriyle böcek birleştirme arcade oyunu. LULULU bug-merge arcade game with viral TikTok sounds."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  audioplayers: ^6.7.1
  shared_preferences: ^2.5.6
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  vibration: ^3.1.3
  image_picker: ^1.2.4
  video_player: ^2.11.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  http: ^1.6.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  in_app_purchase: ^3.3.1
  crypto: ^3.0.8
  noise_meter: ^5.1.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  golden_toolkit: ^0.15.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  config:
    enable-lldb-debugging: false

  assets:
    - assets/
    - assets/icons/
    - assets/icons2/
    - assets/bugs/
    - assets/obstacles/
    - assets/osman/
    - assets/game/
    - assets/images/
    - assets/images/stickers/
    - assets/ui/kenney/Blue/Default/
    - assets/ui/kenney/Blue/Double/
    - assets/ui/kenney/Green/Default/
    - assets/ui/kenney/Green/Double/
    - assets/ui/kenney/Grey/Default/
    - assets/ui/kenney/Grey/Double/
    - assets/ui/kenney/Red/Default/
    - assets/ui/kenney/Red/Double/
    - assets/ui/kenney/Yellow/Default/
    - assets/ui/kenney/Yellow/Double/
    - assets/audio/
    - assets/models/
    - assets/design/backgrounds/
    - assets/design/bugs_hd/
    - assets/design/bugs_new/
    - assets/design/images/
    - assets/design/images/stickers/
    - assets/design/icons/extra_icons/All_Icons/blue_diamond.png
    - assets/design/icons/extra_icons/All_Icons/clock.png
    - assets/design/icons/extra_icons/All_Icons/daily_streak_flame.png
    - assets/design/icons/extra_icons/All_Icons/energy_bolt.png
    - assets/design/icons/extra_icons/All_Icons/explosion.png
    - assets/design/icons/extra_icons/All_Icons/hammer.png
    - assets/design/icons/extra_icons/All_Icons/magnet_boost.png
    - assets/design/icons/extra_icons/All_Icons/target.png
    - assets/design/osman/
    - assets/design/ui/
    - assets/design/ui/icons/
    - assets/design/ui/icons2/
    - assets/design/ui/studio_watch/
    - assets/design/ui/studio_create/
    - assets/design/ui/studio_gif/
    - assets/design/ui/studio_downloads/
    - assets/design/splash/
    - assets/fonts/


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
        - asset: assets/fonts/Fredoka-ExtraBold.ttf
          weight: 800
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/Baloo2-Regular.ttf
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Medium.ttf
          weight: 500
    - family: Bangers
      fonts:
        - asset: assets/fonts/Bangers-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    - family: Exo 2
      fonts:
        - asset: assets/fonts/Exo2-Regular.ttf
        - asset: assets/fonts/Exo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Exo2-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Exo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Exo2-Black.ttf
          weight: 900
