<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- 12R: iPhone Safari'de 980px varsayılan görünüm alanı olmasın;
       oyun dikey mobil düzende açılır. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="LÜLÜLÜ — Böcekleri birleştir, evrimleştir! Suika tarzı birleştirme oyunu ve 11 arcade modu. / Merge the cockroaches, evolve them all! A Suika-style merge game with 11 arcade modes.">
  <meta name="theme-color" content="#121826">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LÜLÜLÜ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LÜLÜLÜ</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* 12R: Flutter motoru ilk kareyi boyayana kadar (~20 sn beyaz
       ekran yerine) koyu zemin + dönen yükleme göstergesi. Salt
       HTML/CSS — motor indirilmeden önce de görünür. İlk karede
       `flutter-first-frame` ile kaldırılır. */
    html, body { margin: 0; padding: 0; background: #121826; }
    #lululu-boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #121826; color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #lululu-boot .logo {
      font-size: 34px; font-weight: 800; letter-spacing: 6px;
      color: #FFD34D;
    }
    #lululu-boot .ring {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #FFB800;
      animation: lululu-boot-spin 1s linear infinite;
    }
    @keyframes lululu-boot-spin { to { transform: rotate(360deg); } }
    #lululu-boot .text { font-size: 15px; color: rgba(255, 255, 255, 0.85); }
  </style>
</head>
<body>
  <div id="lululu-boot" role="status" aria-label="LÜLÜLÜ yükleniyor">
    <div class="logo">LÜLÜLÜ</div>
    <div class="ring" aria-hidden="true"></div>
    <div class="text" id="lululu-boot-text">yükleniyor…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('lululu-boot');
      if (el) el.remove();
    });
    // 60 sn'de ilk kare gelmezse dürüst mesaj: sonsuz dönen
    // gösterge yerine yenileme önerilir.
    setTimeout(function () {
      var t = document.getElementById('lululu-boot-text');
      if (t) t.textContent = 'Yükleme uzun sürdü — bağlantınızı kontrol edip sayfayı yenileyin.';
    }, 60000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
